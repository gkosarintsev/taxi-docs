name: Generate Architecture & Workflow Diagrams

on:
  push:
    paths:
      - 'docs/**/*.puml'
      - '.github/workflows/generate-diagrams.yml'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render_diagrams:
    name: Render Diagrams to SVG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphviz & Download PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-dejavu
          curl -sL "https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar" -o plantuml.jar

      - name: Render All PlantUML & Workflow Diagrams to SVG
        run: |
          echo "Rendering all PlantUML architecture, workflows, sequence, ER, and screen flow diagrams..."
          java -Djava.awt.headless=true -jar plantuml.jar -tsvg "docs/**.puml"
          echo "PlantUML rendering completed successfully."

      - name: Commit and Push Generated SVG Diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(diagrams): auto-generate SVG diagrams from PUML [skip ci]"
          file_pattern: "docs/**/*.svg"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
