<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1386px" preserveAspectRatio="none" style="width:1079px;height:1386px;background:#FFFFFF;" version="1.1" viewBox="0 0 1079 1386" width="1079px" zoomAndPan="magnify"><title>Driver Partner KYC &amp; Vehicle Photo-Inspection Screen Flow</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="469.3213" x="298.0896" y="22.9951">Driver Partner KYC &amp; Vehicle Photo-Inspection Screen Flow</text><!--entity K1--><g id="elem_K1"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="261.5137" x="704" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="198.5088" x="735.5024" y="67.292">1. Registration &amp; Phone OTP</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.5137" x="714" y="83.5889">(Country Code + SMS Verification)</text></g><!--entity K2--><g id="elem_K2"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="268.9854" x="700.5" y="174.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.9854" x="710.5" y="197.292">2. Personal Identity &amp; License Form</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.0703" x="740.9575" y="213.5889">(Name, DOB, Tax ID / SSN)</text></g><!--entity K3--><g id="elem_K3"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="358.96" x="655.5" y="304.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="250.3799" x="709.79" y="327.292">3. Driver's License Camera Scanner</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.96" x="665.5" y="343.5889">(Front &amp; Back with Edge Detection + Anti-Glare)</text></g><!--entity K4--><g id="elem_K4"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="298.1885" x="580" y="434.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="242.7168" x="607.7358" y="457.292">4. Biometric Facial Liveness Check</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="278.1885" x="590" y="473.5889">(Active Video Selfie: Blink &amp; Turn Head)</text></g><!--entity K5--><g id="elem_K5"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="336.8115" x="545.5" y="564.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="246.9688" x="590.4214" y="587.292">5. Vehicle Registration &amp; Insurance</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="316.8115" x="555.5" y="603.5889">(STS &amp; Commercial Policy Document Upload)</text></g><!--entity K6--><g id="elem_K6"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="312.4004" x="558" y="694.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="252.4033" x="587.9985" y="717.292">6. 4-Angle Exterior Photo Inspection</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="292.4004" x="568" y="733.5889">(Front, Rear, Left, Right Assisted Overlay)</text></g><!--entity K7--><g id="elem_K7"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="302.5703" x="337.5" y="824.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259.8066" x="358.8818" y="847.292">7. In-Cabin Interior Cleanliness Photo</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282.5703" x="347.5" y="863.5889">(Seats, Dash &amp; Clean Trunk Verification)</text></g><!--entity K8--><g id="elem_K8"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="380.4863" x="286" y="954.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="252.6904" x="349.8979" y="977.292">8. Fleet Affiliation &amp; Payout Account</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="360.4863" x="296" y="993.5889">(Direct Contractor vs Partner Park + Bank Account)</text></g><!--entity K9--><g id="elem_K9"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="327.5078" x="312" y="1084.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.2217" x="369.6431" y="1107.292">9. KYC Audit Processing Radar</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="307.5078" x="322" y="1123.5889">(Real-Time AI Verification Status: ~2-5 min)</text></g><!--entity K10--><g id="elem_K10"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="317.5957" x="7" y="1214.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.7393" x="44.9282" y="1237.292">10. Verification Approved &amp; Active</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="297.5957" x="17" y="1253.5889">(Push Notification + 'GO ONLINE' Enabled)</text></g><!--entity K11--><g id="elem_K11"><rect fill="#F1F1F1" height="52.5938" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="328.8887" x="571.5" y="1214.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257.1338" x="607.3774" y="1237.292">11. Verification Rejected / Re-upload</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.8887" x="581.5" y="1253.5889">(Highlight Blurry Photo / Expired Document)</text></g><!--entity Driver Home Online Shift--><g id="elem_Driver Home Online Shift"><rect fill="#F1F1F1" height="36.2969" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="195" x="68.5" y="1344.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175" x="78.5" y="1367.292">Driver Home Online Shift</text></g><!--link K1 to K2--><g id="link_K1_K2"><path d="M835,97.3969 C835,119.7169 835,145.9369 835,168.2469 " fill="none" id="K1-to-K2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="835,174.2469,839,165.2469,835,169.2469,831,165.2469,835,174.2469" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.688" x="836" y="140.3638">Phone Verified</text></g><!--link K2 to K3--><g id="link_K2_K3"><path d="M835,227.3969 C835,249.7169 835,275.9369 835,298.2469 " fill="none" id="K2-to-K3" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="835,304.2469,839,295.2469,835,299.2469,831,295.2469,835,304.2469" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.1592" x="836" y="270.3638">Tap</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.7476" x="740.8585" y="293.0798">Scan License</text></g><!--link K3 to K4--><g id="link_K3_K4"><path d="M794.65,357.5669 C783.43,366.0669 771.89,376.2169 763,387.2969 C751.86,401.1769 745.5376,413.706 739.8276,428.366 " fill="none" id="K3-to-K4" style="stroke:#181818;stroke-w