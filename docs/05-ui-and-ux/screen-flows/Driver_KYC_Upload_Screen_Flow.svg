<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1419px" preserveAspectRatio="none" style="width:987px;height:1419px;background:#FFFFFF;" version="1.1" viewBox="0 0 987 1419" width="987px" zoomAndPan="magnify"><title>Driver Partner KYC &amp; Vehicle Photo-Inspection Screen Flow</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="398.3164" x="287.5181" y="24.5332">Driver Partner KYC &amp; Vehicle Photo-Inspection Screen Flow</text><!--entity K1--><g id="elem_K1"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="235.1406" x="644" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.5371" x="671.3018" y="70.1426">1. Registration &amp; Phone OTP</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.1406" x="654" y="87.752">(Country Code + SMS Verification)</text></g><!--entity K2--><g id="elem_K2"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="241.7715" x="640.5" y="178.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.7715" x="650.5" y="203.1426">2. Personal Identity &amp; License Form</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.248" x="674.2617" y="220.752">(Name, DOB, Tax ID / SSN)</text></g><!--entity K3--><g id="elem_K3"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="317.623" x="602.5" y="311.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.4307" x="649.0962" y="336.1426">3. Driver's License Camera Scanner</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="297.623" x="612.5" y="353.752">(Front &amp; Back with Edge Detection + Anti-Glare)</text></g><!--entity K4--><g id="elem_K4"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="267.4404" x="530" y="444.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.8613" x="554.7896" y="469.1426">4. Biometric Facial Liveness Check</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247.4404" x="540" y="486.752">(Active Video Selfie: Blink &amp; Turn Head)</text></g><!--entity K5--><g id="elem_K5"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="305.5303" x="496.5" y="577.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.6748" x="539.9277" y="602.1426">5. Vehicle Registration &amp; Insurance</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="285.5303" x="506.5" y="619.752">(STS &amp; Commercial Policy Document Upload)</text></g><!--entity K6--><g id="elem_K6"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="280.6406" x="509" y="710.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.1299" x="537.2554" y="735.1426">6. 4-Angle Exterior Photo Inspection</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.6406" x="519" y="752.752">(Front, Rear, Left, Right Assisted Overlay)</text></g><!--entity K7--><g id="elem_K7"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="272.1025" x="308.5" y="843.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="232.6816" x="328.2104" y="868.1426">7. In-Cabin Interior Cleanliness Photo</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="252.1025" x="318.5" y="885.752">(Seats, Dash &amp; Clean Trunk Verification)</text></g><!--entity K8--><g id="elem_K8"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="337.8369" x="261.5" y="976.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222.5645" x="319.1362" y="1001.1426">8. Fleet Affiliation &amp; Payout Account</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="317.8369" x="271.5" y="1018.752">(Direct Contractor vs Partner Park + Bank Account)</text></g><!--entity K9--><g id="elem_K9"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="290.3682" x="285.5" y="1109.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.3164" x="333.0259" y="1134.1426">9. KYC Audit Processing Radar</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.3682" x="295.5" y="1151.752">(Real-Time AI Verification Status: ~2-5 min)</text></g><!--entity K10--><g id="elem_K10"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="288.7412" x="7" y="1242.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.668" x="45.5366" y="1267.1426">10. Verification Approved &amp; Active</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="268.7412" x="17" y="1284.752">(Push Notification + 'GO ONLINE' Enabled)</text></g><!--entity K11--><g id="elem_K11"><rect fill="#F1F1F1" height="55.2188" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="291.5576" x="523.5" y="1242.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.0195" x="555.269" y="1267.1426">11. Verification Rejected / Re-upload</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="271.5576" x="533.5" y="1284.752">(Highlight Blurry Photo / Expired Document)</text></g><!--entity Driver Home Online Shift--><g id="elem_Driver Home Online Shift"><rect fill="#F1F1F1" height="37.6094" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="174.8271" x="64" y="1375.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.8271" x="74" y="1400.1426">Driver Home Online Shift</text></g><!--link K1 to K2--><g id="link_K1_K2"><path d="M761.5,100.6194 C761.5,123.1994 761.5,149.4894 761.5,172.1894 " fill="none" id="K1-to-K2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="761.5,178.1894,765.5,169.1894,761.5,173.1894,757.5,169.1894,761.5,178.1894" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2808" x="762.5" y="145.1045">Phone Verified</text></g><!--link K2 to K3--><g id="link_K2_K3"><path d="M761.5,233.6194 C761.5,256.1994 761.5,282.4894 761.5,305.1894 " fill="none" id="K2-to-K3" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="761.5,311.1894,765.5,302.1894,761.5,306.1894,757.5,302.1894,761.5,311.1894" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.4009" x="762.5" y="278.1045">Tap</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.0508" x="675.0155" y="300.8415">Scan License</text></g><!--link K3 to K4--><g id="link_K3_K4"><path d="M722.72,366.7794 C712.22,375.3794 701.55,385.5694 693.5,396.6094 C683.07,410.9194 677.4573,423.6541 672.5873,438.61