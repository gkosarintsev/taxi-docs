syntax = "proto3";

package mobility.location.v1;

option go_package = "mobility/location/v1;locationv1";
option java_multiple_files = true;
option java_package = "com.mobility.location.v1";

service LocationService {
  rpc StreamDriverCoordinates(stream LocationStreamPacket) returns (StreamAckResponse);
  rpc GetNearbyDriversInH3(NearbyDriversRequest) returns (NearbyDriversResponse);
  rpc GetDriverTrajectory(DriverTrajectoryRequest) returns (DriverTrajectoryResponse);
}

message LocationStreamPacket {
  string driver_id = 1;
  string vehicle_id = 2;
  double latitude = 3;
  double longitude = 4;
  double bearing = 5;
  double speed_kph = 6;
  double accuracy_meters = 7;
  int64 timestamp_unix_ms = 8;
  string current_status = 9;
}

message StreamAckResponse {
  bool acknowledged = 1;
  int64 server_time_unix_ms = 2;
}

message NearbyDriversRequest {
  string center_h3_res8 = 1;
  int32 kring_radius = 2;
  string tariff_filter = 3;
}

message NearbyDriverEntry {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  double bearing = 4;
  string h3_cell = 5;
  int64 last_updated_unix_ms = 6;
}

message NearbyDriversResponse {
  repeated NearbyDriverEntry drivers = 1;
}

message DriverTrajectoryRequest {
  string ride_id = 1;
  int64 start_time_unix_ms = 2;
  int64 end_time_unix_ms = 3;
}

message TrajectoryPoint {
  double latitude = 1;
  double longitude = 2;
  double speed_kph = 3;
  int64 timestamp_unix_ms = 4;
}

message DriverTrajectoryResponse {
  string ride_id = 1;
  repeated TrajectoryPoint points = 2;
  double total_distance_meters = 3;
}
